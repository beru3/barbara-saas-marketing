name: Update Issue Once

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Insert new posts into Issue #1
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1
            });

            const newEntries = [
              "- [ ] `gen-20260802-1` 今年の夏は例年以上の暑さが続きました。この時期「夏だから仕方ない」と外来の静けさを受け入れていませんか。離脱した患者さんを後から呼び戻すより、来なくなる前に気づいてひと声かけるほうが手間はずっと少ない。先生の院は、早めに気づける仕組みで動いていますか。",
              "- [ ] `gen-20260802-2` 「患者さんが来なくなる理由」には5つのパターンがあります。夏に増えるのは「症状がないから大丈夫」と「外出が億劫」の組み合わせです。この2つが重なると、秋になっても自然には戻りません。今月、先生の院でこのパターンに当てはまる患者さんが何人いるか——見えますか。→ https://note.com/furuie_akihiro/n/n9d2eba45019f",
              "- [ ] `gen-20260802-3` 来院頻度で患者さんを分けると、見えてくる層があります。毎月来る方は習慣化されています。半年に1回の方はもう「来ない層」に近い。最も注意したいのは「2〜3ヶ月に1回」の方——本人も院も気づきにくいまま間隔が空いていくケースです。先生の院でこの層が何人いるか、把握できていますか。"
            ].join('\n');

            const marker = '\n\n## 投稿済み';
            const oldBody = issue.data.body;
            const insertPos = oldBody.indexOf(marker);

            let newBody;
            if (insertPos >= 0) {
              newBody = oldBody.slice(0, insertPos) + '\n' + newEntries + oldBody.slice(insertPos);
              console.log(`Inserted at position ${insertPos}`);
            } else {
              newBody = oldBody + '\n' + newEntries;
              console.log('Marker not found, appended');
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: newBody
            });

            console.log('Issue #1 updated with gen-20260802-1/2/3');
